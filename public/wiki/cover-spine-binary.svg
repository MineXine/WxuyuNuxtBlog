<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" role="img" aria-label="3.5 二进制骨架格式速查">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2C"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.28" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#79AEE8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#79AEE8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#79AEE8" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="525" fill="url(#bg2)"/>
  <rect width="1200" height="525" fill="url(#grid2)"/>
  <rect width="1200" height="525" fill="url(#glow2)"/>

  <!-- 二进制块 -->
  <g transform="translate(96 158)" font-family="ui-monospace, 'Cascadia Mono', monospace" font-size="26" fill="#79AEE8">
    <g opacity="0.9">
      <rect x="0" y="0" width="104" height="44" rx="8" fill="#79AEE8" fill-opacity="0.16" stroke="#79AEE8" stroke-opacity="0.5"/>
      <text x="14" y="31">0x1C</text>
      <rect x="112" y="0" width="104" height="44" rx="8" fill="#79AEE8" fill-opacity="0.1" stroke="#79AEE8" stroke-opacity="0.35"/>
      <text x="126" y="31">.skel</text>
    </g>
    <g transform="translate(0 68)" opacity="0.75">
      <rect x="0" y="0" width="104" height="44" rx="8" fill="#79AEE8" fill-opacity="0.1" stroke="#79AEE8" stroke-opacity="0.35"/>
      <text x="14" y="31">BE</text>
      <rect x="112" y="0" width="104" height="44" rx="8" fill="#79AEE8" fill-opacity="0.1" stroke="#79AEE8" stroke-opacity="0.35"/>
      <text x="126" y="31">varint</text>
    </g>
  </g>

  <text x="404" y="212" fill="#79AEE8" font-family="'LXGW WenKai Screen', 'Noto Sans SC', sans-serif" font-size="30" letter-spacing="10" opacity="0.75">BINARY FORMAT · SPINE 3.5</text>
  <text x="400" y="316" fill="#E8F1FB" font-family="'LXGW WenKai Screen', 'Noto Sans SC', sans-serif" font-size="78" font-weight="700" letter-spacing="6">二进制骨架速查</text>
  <text x="404" y="380" fill="#9DBCD8" font-family="'LXGW WenKai Screen', 'Noto Sans SC', sans-serif" font-size="28" letter-spacing="4" opacity="0.9">字节序 · 文件头 · 时间轴 · 排错清单</text>

  <g stroke="#79AEE8" stroke-opacity="0.35" stroke-width="2">
    <path d="M96 452h210"/>
    <circle cx="316" cy="452" r="4" fill="#79AEE8" stroke="none"/>
  </g>
</svg>
