<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" preserveAspectRatio="none" role="img" aria-label="名字铭牌">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2013"/>
      <stop offset="0.45" stop-color="#24140C"/>
      <stop offset="1" stop-color="#120905"/>
    </linearGradient>
    <linearGradient id="plateLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A85C" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#F0D197"/>
      <stop offset="0.5" stop-color="#A9713A"/>
      <stop offset="0.82" stop-color="#F0D197"/>
      <stop offset="1" stop-color="#D9A85C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE7BC"/>
      <stop offset="1" stop-color="#B37F3E"/>
    </linearGradient>
  </defs>

  <rect width="240" height="52" fill="url(#plate)"/>
  <rect width="240" height="1.6" fill="url(#plateLine)"/>

  <!-- 两侧立柱高光 -->
  <rect x="0" y="0" width="1" height="52" fill="#E9C584" opacity="0.28"/>
  <rect x="239" y="0" width="1" height="52" fill="#E9C584" opacity="0.28"/>

  <!-- 角部铜钉 -->
  <g fill="url(#goldP)">
    <path d="M10 9l3 3-3 3-3-3z"/>
    <path d="M230 9l3 3-3 3-3-3z"/>
    <path d="M10 43l3 3-3 3-3-3z" opacity="0.75"/>
    <path d="M230 43l3 3-3 3-3-3z" opacity="0.75"/>
  </g>

  <!-- 顶边中心菱形 -->
  <g fill="url(#goldP)">
    <path d="M120 0l5 5-5 5-5-5z"/>
  </g>

  <!-- 底部卷云 -->
  <g fill="none" stroke="url(#goldP)" stroke-width="1.1" opacity="0.55">
    <path d="M96 50c5-6 13-6 18 0"/>
    <path d="M144 50c-5-6-13-6-18 0"/>
  </g>
</svg>
