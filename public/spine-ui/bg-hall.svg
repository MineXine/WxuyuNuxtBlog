<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="图鉴暖木厅堂背景">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2417"/>
      <stop offset="0.45" stop-color="#331A11"/>
      <stop offset="1" stop-color="#1A0B07"/>
    </linearGradient>
    <radialGradient id="lampL" cx="0.14" cy="0.2" r="0.48">
      <stop offset="0" stop-color="#F7CB86" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E0A45E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E0A45E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampR" cx="0.9" cy="0.26" r="0.44">
      <stop offset="0" stop-color="#F2C67F" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#EFC07B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#8A5330" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8A5330" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDCA4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFDCA4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="seams" width="220" height="1000" patternUnits="userSpaceOnUse">
      <rect width="2" height="1000" fill="#000" opacity="0.22"/>
      <rect x="2" width="1" height="1000" fill="#FFF2DC" opacity="0.05"/>
      <rect x="110" width="1" height="1000" fill="#FFF2DC" opacity="0.03"/>
    </pattern>
    <pattern id="lattice" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 6 L52 28 L28 50 L4 28 Z" fill="none" stroke="#FFE0B0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#seams)" opacity="0.55"/>
  <rect width="1600" height="1000" fill="url(#lattice)" opacity="0.7"/>
  <rect width="1600" height="1000" fill="url(#center)"/>
  <rect width="1600" height="1000" fill="url(#lampL)"/>
  <rect width="1600" height="1000" fill="url(#lampR)"/>

  <!-- 两侧透光窗格 -->
  <g opacity="0.5">
    <rect x="74" y="180" width="46" height="470" fill="url(#beam)"/>
    <rect x="150" y="220" width="18" height="410" fill="#FFD9A0" opacity="0.08"/>
    <rect x="1478" y="200" width="44" height="440" fill="url(#beam)"/>
    <rect x="1424" y="240" width="16" height="380" fill="#FFD9A0" opacity="0.07"/>
  </g>

  <!-- 桌案与地面暗带 -->
  <g opacity="0.55">
    <rect y="812" width="1600" height="188" fill="#120805"/>
    <rect y="806" width="1600" height="3" fill="#C08A3E" opacity="0.25"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.6"/>
</svg>
